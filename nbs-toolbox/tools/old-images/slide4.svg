/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(9.6 28)">蘭陽溪流域課題<tspan font-size="24" x="0" y="28">對象與需求</tspan><tspan font-size="24" x="120" y="28">—</tspan>挑戰—因子—解方—環境/生態系<tspan font-weight="700" font-size="19" x="575.448" y="196">河岸城鎮</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="575.448" y="219"></tspan><tspan font-size="19" x="605.448" y="219">挑戰：洪水、河道變化</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="575.448" y="241"></tspan><tspan font-size="19" x="605.448" y="241">因子：淤砂、地勢、坡地崩塌</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="575.448" y="263"></tspan><tspan font-size="19" x="605.448" y="263">解方：氾濫空間保留、入滲能加強、束洪、河</tspan><tspan font-size="19" x="605.448" y="286">道整理、堤岸建置、中上游水土保持與管制</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="575.448" y="308"></tspan><tspan font-size="19" x="605.448" y="308">環境：強化與利用自然滯洪能力。</tspan><tspan fill="#C00000" font-weight="700" font-size="19" x="605.448" y="331">束洪同時是否有機會維護生態棲地</tspan><tspan fill="#C00000" font-weight="700" font-size="19" x="885.448" y="331">?</tspan><tspan font-weight="700" font-size="19" x="826.357" y="536">自然環境保護</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="826.357" y="559"></tspan><tspan font-size="19" x="856.357" y="559">挑戰：河口水鳥棲地保護、河川環境維持</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="826.357" y="581"></tspan><tspan font-size="19" x="856.357" y="581">因子：農業民生排水、砂石開採、河口濕地輸入</tspan><tspan font-size="19" x="856.357" y="603">輸出、生物</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="826.357" y="626"></tspan><tspan font-size="19" x="856.357" y="626">解方：親水空間、排放標準、砂石管制</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-size="19" x="826.357" y="648"></tspan><tspan font-size="19" x="856.357" y="648">環境：民眾環境意識強化、水質改善。</tspan><tspan fill="#C00000" font-weight="700" font-size="19" x="856.357" y="671">河口濕地輸入輸出與上游管理息息相關</tspan></text><path d="M574 370 619.46 370 619.46 396.827 663 396.827 663 467 574 467 574 440.173 574 396.827Z" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF" fill-rule="evenodd"/><rect x="602" y="381" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="583" y="381" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><path d="M671 467 704.04 467" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><rect x="602" y="403" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="583" y="403" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="602" y="426" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="583" y="426" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="623" y="403" width="10" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="623" y="426" width="10" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="643" y="403" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><rect x="643" y="426" width="9" height="6" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF"/><path d="M0 0 0.000104987 35.6144" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="none" fill-rule="evenodd" transform="matrix(1 0 0 -1 680 467.614)"/><path d="M675 438C675 431.925 677.462 427 680.5 427 683.538 427 686 431.925 686 438 686 444.075 683.538 449 680.5 449 677.462 449 675 444.075 675 438Z" stroke="#000000" stroke-width="2" stroke-miterlimit="8" fill="#FFFFFF" fill-rule="evenodd"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="700" font-size="19" transform="translate(255.274 599)">水資源需求<tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="19" x="0" y="23"></tspan><tspan font-weight="400" font-size="19" x="30" y="23">挑戰：缺乏水庫不利水資源調配</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="19" x="0" y="45"></tspan><tspan font-weight="400" font-size="19" x="30" y="45">因子：雨量、流量、水質、河與濱溪生物</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="19" x="0" y="67"></tspan><tspan font-weight="400" font-size="19" x="30" y="67">解方：攔河堰、生態流量</tspan><tspan font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="19" x="0" y="90"></tspan><tspan font-weight="400" font-size="19" x="30" y="90">環境：維持生態流量降低生態衝擊。</tspan><tspan font-size="19" x="-245.674" y="-353">設施保護</tspan><tspan font-weight="400" font-size="19" x="-245.674" y="-330">挑戰：堤防、橋基腳破壞</tspan><tspan font-weight="400" font-size="19" x="-245.674" y="-308">因子：河水沖刷</tspan><tspan font-weight="400" font-size="19" x="-245.674" y="-286">解方：塊石堆疊</tspan><tspan font-weight="400" font-size="19" x="-245.674" y="-263">環境：</tspan><tspan fill="#C00000" font-size="19" x="-189.674" y="-263">堆疊塊石之孔隙可提</tspan><tspan fill="#C00000" font-size="19" x="-245.674" y="-241">供生物棲地</tspan></text></g></svg>