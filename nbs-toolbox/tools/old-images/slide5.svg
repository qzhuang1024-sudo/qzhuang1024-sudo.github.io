<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="1280" height="720"/></clipPath></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><path d="M0 312.168C-6.34975e-15 283.356 23.3562 260 52.1676 260L260.832 260C289.644 260 313 283.356 313 312.168L313 606.832C313 635.644 289.644 659 260.832 659L52.1676 659C23.3562 659-1.26995e-14 635.644-1.26995e-14 606.832Z" fill="#F8C891" fill-rule="evenodd"/><text font-family="Microsoft JhengHei UI,Microsoft JhengHei UI_MSFontService,sans-serif" font-weight="700" font-size="19" transform="translate(15.2813 381)">盤點因子與建立概念模型<tspan font-weight="400" font-size="19" x="0" y="22">經濟、社會、生態系統之間的相互</tspan><tspan font-weight="400" font-size="19" x="0" y="45">作用，以及此系統內外部重要因子。</tspan><tspan font-size="19" x="0" y="74">設定課題優先級</tspan><tspan font-weight="400" font-size="19" x="0" y="96">IUCN</tspan><tspan font-weight="400" font-size="19" x="46.6667" y="96">的</tspan><tspan font-weight="400" font-size="19" x="65.3333" y="96">NbS</tspan><tspan font-weight="400" font-size="19" x="107.5" y="96">標準</tspan><tspan font-weight="400" font-size="19" x="144.833" y="96">1.1</tspan><tspan font-weight="400" font-size="19" x="170.833" y="96">為優先考慮</tspan><tspan font-weight="400" font-size="19" x="0" y="119">權利持有者和受益者最迫切的社會</tspan><tspan font-weight="400" font-size="19" x="0" y="141">挑戰。</tspan><tspan font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-size="27" x="87.9057" y="-126">了解系統</tspan></text><path d="M14 109.5C14 102.597 19.5965 97 26.5002 97L286.5 97C293.403 97 299 102.597 299 109.5L299 159.5C299 166.403 293.403 172 286.5 172L26.5002 172C19.5965 172 14 166.403 14 159.5Z" fill="#D9D9D9" fill-rule="evenodd"/><text font-family="Microsoft JhengHei UI,Microsoft JhengHei UI_MSFontService,sans-serif" font-weight="400" font-size="16" transform="translate(27.4908 121)">課題與目標可能來自於民眾與專家意<tspan font-size="16" x="0" y="20">見，政府對於地區發展願景、國際共</tspan><tspan font-size="16" x="0" y="39">識等。</tspan></text><path d="M322 312.168C322 283.356 345.356 260 374.168 260L582.832 260C611.644 260 635 283.356 635 312.168L635 606.832C635 635.644 611.644 659 582.832 659L374.168 659C345.356 659 322 635.644 322 606.832Z" fill="#CCD8E7" fill-rule="evenodd"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="700" font-size="19" transform="translate(337.601 291)">構想方案<tspan font-weight="400" font-size="19" x="0" y="20">基於對挑戰機制與背景、相關參與</tspan><tspan font-weight="400" font-size="19" x="0" y="40">者意見下構想可能解方。</tspan><tspan font-size="19" x="0" y="67">評估方案</tspan><tspan font-weight="400" font-size="19" x="0" y="87">評估方案的預期成效、提供之人類</tspan><tspan font-weight="400" font-size="19" x="0" y="107">福祉</tspan><tspan font-weight="400" font-size="19" x="37.3333" y="107">/</tspan><tspan font-weight="400" font-size="19" x="45.1667" y="107">生態系裨益；協商</tspan><tspan font-weight="400" font-size="19" x="194.5" y="107">/</tspan><tspan font-weight="400" font-size="19" x="202.333" y="107">權衡；以</tspan><tspan font-weight="400" font-size="19" x="0" y="128">及其經濟可行性。</tspan><tspan font-size="19" x="0" y="154">執行與合作機制</tspan><tspan font-weight="400" font-size="19" x="0" y="174">確認個工作劃分與負責單位。</tspan><tspan font-size="19" x="0" y="201">制定監測與評估機制</tspan><tspan font-weight="400" font-size="19" x="0" y="221">該方案對成效、人類福祉</tspan><tspan font-weight="400" font-size="19" x="205.333" y="221">/</tspan><tspan font-weight="400" font-size="19" x="213.167" y="221">生態系</tspan><tspan font-weight="400" font-size="19" x="0" y="242">裨益的監測與評估方式。利害關係</tspan><tspan font-weight="400" font-size="19" x="0" y="262">者反饋與申訴機制。權衡界線的檢</tspan><tspan font-weight="400" font-size="19" x="0" y="282">查機制。</tspan><tspan font-size="19" x="0" y="309">選擇方案</tspan><tspan font-weight="400" font-size="19" x="0" y="329">在各面向</tspan><tspan font-weight="400" font-size="19" x="74.6667" y="329">(</tspan><tspan font-weight="400" font-size="19" x="80.6667" y="329">經濟、成效、執行難易</tspan><tspan font-weight="400" font-size="19" x="0" y="349">度等</tspan><tspan font-weight="400" font-size="19" x="37.3333" y="349">)</tspan><tspan font-weight="400" font-size="19" x="43.3333" y="349">考量下選擇方案。</tspan><tspan font-size="27" x="61.239" y="-36">制定行動計畫</tspan></text><path d="M967 312.168C967 283.356 990.356 260 1019.17 260L1227.83 260C1256.64 260 1280 283.356 1280 312.168L1280 606.832C1280 635.644 1256.64 659 1227.83 659L1019.17 659C990.356 659 967 635.644 967 606.832Z" fill="#C9D3BE" fill-rule="evenodd"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="700" font-size="19" transform="translate(982.241 368)">監測評估<tspan font-weight="400" font-size="19" x="0" y="20">透過監測與評估計機制</tspan><tspan font-weight="400" font-size="19" x="186.667" y="20">衡量</tspan><tspan font-weight="400" font-size="19" x="224" y="20">成效、</tspan><tspan font-weight="400" font-size="19" x="0" y="40">評估人類福祉</tspan><tspan font-weight="400" font-size="19" x="112" y="40">/</tspan><tspan font-weight="400" font-size="19" x="119.833" y="40">生態系裨益；檢查</tspan><tspan font-weight="400" font-size="19" x="0" y="60">權衡界線是否受到越界；檢討利害</tspan><tspan font-weight="400" font-size="19" x="0" y="81">關係者反饋。</tspan><tspan font-size="19" x="0" y="107">成果與經驗</tspan><tspan font-weight="400" font-size="19" x="0" y="128">透過公開分享成果與經驗或教訓，</tspan><tspan font-weight="400" font-size="19" x="0" y="148">促進</tspan><tspan font-weight="400" font-size="19" x="37.3333" y="148">NbS</tspan><tspan font-weight="400" font-size="19" x="74.8333" y="148">的推廣與主流化，帶來更</tspan><tspan font-weight="400" font-size="19" x="0" y="168">多積極的改變。</tspan><tspan font-size="27" x="73.2813" y="-112">監測與評估</tspan><tspan font-size="27" x="-274.414" y="-112">方案確定與執行</tspan><tspan font-weight="400" font-size="16" x="-469.998" y="311">設計過程發現概念模型</tspan><tspan font-weight="400" font-size="16" x="-469.998" y="329">不足或者需要修正</tspan><tspan font-weight="400" font-size="16" x="-153.213" y="311">執行過程發現解方不足或者需要修正，因</tspan><tspan font-weight="400" font-size="16" x="-63.7126" y="329">此需對現況</tspan><tspan font-weight="400" font-size="16" x="16.2874" y="329">\</tspan><tspan font-weight="400" font-size="16" x="22.7874" y="329">機制進一步釐清</tspan><tspan font-size="27" x="-879.054" y="-283">專案啟動</tspan></text><path d="M162.833 172.5 162.833 199.069 152.167 199.069 152.167 172.5ZM173.5 193.736 157.5 225.736 141.5 193.736Z" fill="#7F7F7F"/><path d="M645 312.168C645 283.356 668.356 260 697.168 260L905.832 260C934.644 260 958 283.356 958 312.168L958 606.832C958 635.644 934.644 659 905.832 659L697.168 659C668.356 659 645 635.644 645 606.832Z" fill="#D9D9D9" fill-rule="evenodd"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="19" transform="translate(659.921 444)">完善計畫內容，包含方案程序制定<tspan font-size="19" x="0" y="23">與執行與監督權責劃分。並依規劃</tspan><tspan font-size="19" x="0" y="45">各司其職</tspan></text><path d="M278.5 238.167 342.684 238.167 342.684 248.833 278.5 248.833ZM337.351 227.5 369.351 243.5 337.351 259.5Z" fill="#7F7F7F"/><path d="M596.5 238.167 660.684 238.167 660.684 248.833 596.5 248.833ZM655.351 227.5 687.351 243.5 655.351 259.5Z" fill="#7F7F7F"/><path d="M6.16319e-06-5.33333 64.1839-5.33326 64.1839 5.33341-6.16319e-06 5.33333ZM58.8506-15.9999 90.8506 0.000104987 58.8506 16.0001Z" fill="#7F7F7F" transform="matrix(1 0 0 -1 915.5 243.5)"/><path d="M0 0 0.000104987 47.3756" stroke="#7F7F7F" stroke-width="10.6667" stroke-miterlimit="8" fill="none" fill-rule="evenodd" transform="matrix(-1 0 0 1 479.5 659.5)"/><path d="M5.33333-1.0518e-05 5.33339 26.5688-5.33328 26.5688-5.33333 1.0518e-05ZM16 21.2355 0.000104987 53.2355-16 21.2355Z" fill="#7F7F7F" transform="matrix(1 0 0 -1 157.5 712.736)"/><path d="M155.5 706.5 1127.83 706.5" stroke="#7F7F7F" stroke-width="10.6667" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><path d="M0 0 0.000104987 52.9134" stroke="#7F7F7F" stroke-width="10.6667" stroke-miterlimit="8" fill="none" fill-rule="evenodd" transform="matrix(-1 0 0 1 1126.5 659.5)"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="43" transform="translate(9.5999 46)">自然解方導入流程<tspan font-size="16" x="344" y="-26">本表搭配自然解方簡表</tspan><tspan font-size="16" x="504" y="-26">(</tspan><tspan font-size="16" x="509.167" y="-26">二</tspan><tspan font-size="16" x="525.167" y="-26">)</tspan><tspan font-size="16" x="530.333" y="-26">，</tspan><tspan fill="#C00000" font-size="16" x="546.333" y="-26">呼應</tspan><tspan fill="#C00000" font-size="16" x="578.333" y="-26">IUCN</tspan><tspan fill="#C00000" font-size="16" x="622.167" y="-26">NbS</tspan><tspan fill="#C00000" font-size="16" x="658.333" y="-26">自我評估標準。</tspan></text></g></svg>