<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="1280" height="720"/></clipPath></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><path d="M595 204 685.26 204" stroke="#7F7F7F" stroke-width="8" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><path d="M0 0C17.303 0 34.606 11.1232 34.606 22.2463" stroke="#7F7F7F" stroke-width="8" stroke-miterlimit="8" fill="none" fill-rule="evenodd" transform="matrix(1.83697e-16 1 1 -1.83697e-16 707 280)"/><path d="M0 0C95.1205 0 190.241 12.1469 190.241 24.2935" stroke="#7F7F7F" stroke-width="8" stroke-miterlimit="8" fill="none" fill-rule="evenodd" transform="matrix(1.83697e-16 1 1 -1.83697e-16 707 280)"/><path d="M197 153.334C197 139.342 208.342 128 222.334 128L569.666 128C583.658 128 595 139.342 595 153.334L595 254.666C595 268.658 583.658 280 569.666 280L222.334 280C208.342 280 197 268.658 197 254.666Z" fill="#F8C891" fill-rule="evenodd"/><rect x="197" y="128" width="44" height="152" fill="#FDEDDA"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="19" transform="translate(209.555 180)">社<tspan font-size="19" x="0" y="20">會</tspan><tspan font-size="19" x="0" y="40">挑</tspan><tspan font-size="19" x="0" y="60">戰</tspan><tspan fill="#93540A" font-size="17" x="40.8877" y="-30">全球七大社會挑戰：氣候變遷與調適、災害</tspan><tspan fill="#93540A" font-size="17" x="40.8877" y="-9">風險、社會經濟發展、人類健康、糧食安全、</tspan><tspan fill="#93540A" font-size="17" x="40.8877" y="11">水資源安全、環境惡化與生物多樣性流失等</tspan><tspan fill="#93540A" font-size="17" x="40.8877" y="32">現象。</tspan><tspan fill="#93540A" font-weight="700" font-size="17" x="40.8877" y="53">本格用於描述社會挑戰，包含現況、相關因</tspan><tspan fill="#93540A" font-weight="700" font-size="17" x="40.8877" y="74">子、以及環境</tspan><tspan fill="#93540A" font-weight="700" font-size="17" x="144.888" y="74">─</tspan><tspan fill="#93540A" font-weight="700" font-size="17" x="157.221" y="74">社會</tspan><tspan fill="#93540A" font-weight="700" font-size="17" x="191.888" y="74">─</tspan><tspan fill="#93540A" font-weight="700" font-size="17" x="204.221" y="74">經濟互動模型。</tspan></text><path d="M685 153.334C685 139.342 696.342 128 710.334 128L1057.67 128C1071.66 128 1083 139.342 1083 153.334L1083 254.666C1083 268.658 1071.66 280 1057.67 280L710.334 280C696.342 280 685 268.658 685 254.666Z" fill="#CCD8E7" fill-rule="evenodd"/><rect x="685" y="128" width="45" height="152" fill="#E6ECF3"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="19" transform="translate(698.043 180)">干<tspan font-size="19" x="0" y="20">預</tspan><tspan font-size="19" x="0" y="40">手</tspan><tspan font-size="19" x="0" y="60">段</tspan><tspan fill="#344E6D" font-weight="700" font-size="17" x="41.1797" y="-30">本格用於描述如何處裡社會挑戰之干預手段。</tspan><tspan fill="#344E6D" font-size="17" x="41.1797" y="-9">基於「社會挑戰」描述之狀況與因子所提出</tspan><tspan fill="#344E6D" font-size="17" x="41.1797" y="11">之應對方式。</tspan><tspan fill="#344E6D" font-size="17" x="41.1797" y="32">自然解方為藉由保護、永續管理、恢復自然</tspan><tspan fill="#344E6D" font-size="17" x="41.1797" y="53">以及改變生態系解決社會挑戰、提供人類福</tspan><tspan fill="#344E6D" font-size="17" x="41.1797" y="74">祉與生物多樣性裨益的行動。</tspan></text><path d="M730 317.667C730 304.596 740.596 294 753.667 294L1057.33 294C1070.4 294 1081 304.596 1081 317.667L1081 412.333C1081 425.404 1070.4 436 1057.33 436L753.667 436C740.596 436 730 425.404 730 412.333Z" fill="#CCD8E7" fill-rule="evenodd"/><rect x="730" y="294" width="351" height="42" fill="#E6ECF3"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="19" transform="translate(868.133 321)">人類福祉<tspan fill="#344E6D" font-size="17" x="-127.872" y="38">本格用於回應「解方」如何考量、評估、保</tspan><tspan fill="#344E6D" font-size="17" x="-127.872" y="59">護、提供人類福祉。</tspan></text><path d="M732 473.667C732 460.596 742.596 450 755.667 450L1059.33 450C1072.4 450 1083 460.596 1083 473.667L1083 568.333C1083 581.404 1072.4 592 1059.33 592L755.667 592C742.596 592 732 581.404 732 568.333Z" fill="#CCD8E7" fill-rule="evenodd"/><rect x="732" y="450" width="351" height="42" fill="#E6ECF3"/><text font-family="Microsoft JhengHei,Microsoft JhengHei_MSFontService,sans-serif" font-weight="400" font-size="19" transform="translate(879.514 477)">生態系<tspan fill="#344E6D" font-size="17" x="-138.244" y="36">本格用於回應「解方」如何考量、評估、影</tspan><tspan fill="#344E6D" font-size="17" x="-138.244" y="57">響、保護自然環境、生態系功能以提供生態</tspan><tspan fill="#344E6D" font-size="17" x="-138.244" y="77">系裨益。</tspan><tspan font-size="43" x="-869.914" y="-431">自然解方簡表</tspan><tspan font-size="43" x="-613.914" y="-431">(</tspan><tspan font-size="43" x="-600.247" y="-431">一</tspan><tspan font-size="43" x="-557.581" y="-431">)</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="21" x="-869.914" y="-401">Nature</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="21" x="-809.894" y="-401">-</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="21" x="-803.394" y="-401">based Solution Profile</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="21" x="-609.407" y="-401">I</tspan><tspan font-size="16" x="-525.914" y="-457">本表用於簡介應用之</tspan><tspan font-size="16" x="-381.914" y="-457">NbS</tspan><tspan font-size="16" x="-349.747" y="-457">如何「藉由保護、永續管理、恢復自然以及改變生態系</tspan><tspan fill="#F3A447" font-weight="700" font-size="16" x="34.2526" y="-457">解決社會挑戰</tspan><tspan font-size="16" x="130.253" y="-457">、提供</tspan><tspan fill="#809EC2" font-weight="700" font-size="16" x="178.253" y="-457">人類福祉</tspan><tspan font-size="16" x="242.253" y="-457">與</tspan><tspan fill="#809EC2" font-weight="700" font-size="16" x="258.253" y="-457">生物多樣性裨益」</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-525.914" y="-441">“Nature</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-480.581" y="-441">-</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-476.247" y="-441">based Solutions are actions to protect, sustainably manage and restore natural and modified ecosystems in ways that addr</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="219.253" y="-441">ess societal challenges </tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-525.914" y="-424">effectively and adaptively, to provide both human well</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-215.747" y="-424">-</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-211.414" y="-424">being and biodiversity benefits</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="-33.414" y="-424">(Cohen</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="7.25262" y="-424">-</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="11.586" y="-424">Shacham</tspan><tspan font-family="Calibri,Calibri_MSFontService,sans-serif" font-size="14" x="66.4193" y="-424">et al., 2016)”</tspan></text></g></svg>